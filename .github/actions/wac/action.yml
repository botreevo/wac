name: wac
description: >
  Put a `wac` command on PATH, built from a commit of this repository with the bootstrap ladder on Node, and
  cached by that commit — so a project is tested with the wac it pins, and the five-minute build happens once
  per wac version rather than once per run.
inputs:
  commit:
    description: The commit to build wac from; empty for this checkout's projects/wac.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: which
      shell: bash
      run: |
        # A commit from before wac moved into projects/wac has it at the root.
        c="${{ inputs.commit }}"
        if [ -z "$c" ]; then key="tree-$(git rev-parse HEAD:projects/wac)"; else key="commit-$c"; fi
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "commit=$c" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/.wac-bin
        key: wac-node22-${{ steps.which.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -eu
        src=$(mktemp -d)
        c="${{ steps.which.outputs.commit }}"
        if [ -z "$c" ]; then cp -R projects/wac/. "$src/"; rm -rf "$src/.git"
        elif git cat-file -e "$c:projects/wac/bootstrap.sh" 2>/dev/null; then git archive "$c" projects/wac | tar -x -C "$src" --strip-components=2
        else git archive "$c" | tar -x -C "$src"; fi
        mkdir -p ~/.wac-bin
        # On failure, the end of the output becomes an annotation: the reason is then on the run's summary.
        if ! (cd "$src" && ./bootstrap.sh --host nodejs -o ~/.wac-bin/wac) > "$RUNNER_TEMP/bootstrap.log" 2>&1; then
          cat "$RUNNER_TEMP/bootstrap.log"
          echo "::error title=wac did not build::$(tail -n 25 "$RUNNER_TEMP/bootstrap.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit 1
        fi
        tail -n 5 "$RUNNER_TEMP/bootstrap.log"
    - shell: bash
      run: echo "$HOME/.wac-bin" >> "$GITHUB_PATH"
