<!doctype html><meta charset=utf-8><script>
// A packaged sandbox page: a unique origin, no extension API. It writes in the document its parent hands it, once.
addEventListener('message', function once(e) {
  if (e.source !== parent || typeof e.data.document !== 'string') return;
  removeEventListener('message', once);
  document.open(); document.write(e.data.document); document.close();
});
parent.postMessage({ ready: true }, '*');
</script>
