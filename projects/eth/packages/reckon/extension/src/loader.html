<!doctype html><meta charset=utf-8><title>app</title><script>
// A packaged sandbox page: a unique origin, no extension API, and a CSP under which it reaches no network. It writes in
// the one document its parent hands it, built from verified bytes (build-doc.js), and does nothing else.
addEventListener('message', function once(e) {
  if (e.source !== parent || !e.data || typeof e.data.document !== 'string') return;
  removeEventListener('message', once);
  document.open(); document.write(e.data.document); document.close();
});
parent.postMessage({ ready: true }, '*');
</script>
