<!doctype html><meta charset=utf-8><title>reckon</title>
<link rel=stylesheet href="page.css">
<form id=open><input id=subject placeholder="ens:NAME, name:NAME@0xPUB or a CID" size=60 autocomplete=off>
<input id=role value=app size=8> <button>open</button> <a href="#settings" id=show-settings>settings</a></form>
<details id=settings><summary>settings</summary>
<label>checkpoint <input id=checkpoint size=70></label>
<label>beacon node <input id=beaconUrl size=50></label>
<label>execution RPC <input id=rpc size=50></label>
<label>registry, code hash <input id=registry size=44> <input id=codeHash size=70></label>
<label>mirrors and gateways, one per line (a public trustless gateway: https://trustless-gateway.link) <textarea id=mirrors rows=3 cols=60 placeholder="https://…"></textarea></label>
<label>policy (JSON5) <textarea id=policy rows=8 cols=80></textarea></label>
<label>clock slot, fixed (for recorded data only; empty reads the clock) <input id=now size=12></label>
<button id=save type=button>save</button></details>
<p id=asof></p>
<pre id=account></pre>
<iframe id=app title=app></iframe>
<script type=module src="page.js"></script>
