[package]
name = "drive-wasmtime"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# The `wacc-drive/1` machine's Rust runner (docs/drive-machine.md): wac's own Rust file set (bootstrap/rust-ladder's
# flatten.rs, taken from the pinned source at build time, WAC_SRC) and a driver for the wacc the ladder built, on
# wasmtime as wac's native host runs it, built offline from that host's cargo cache.

[dependencies]
wasmtime = { version = "47", default-features = false, features = ["cranelift", "runtime", "gc", "gc-drc", "gc-copying", "gc-null"] }
