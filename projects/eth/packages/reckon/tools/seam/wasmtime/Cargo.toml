[package]
name = "seam-wasmtime"
version = "0.1.0"
edition = "2021"
publish = false

# One rung of wac's bootstrap ladder, run on wasmtime: the `wasm-seam/1` machine's second runner (docs/seam-machine.md).
# The same wasmtime, and the same proposals and collector, as wac's own native host (wac/native), so it builds from
# the cargo cache that host left.

[dependencies]
wasmtime = { version = "47", default-features = false, features = ["cranelift", "runtime", "gc", "gc-drc", "gc-copying", "gc-null"] }

[profile.release]
opt-level = 3
